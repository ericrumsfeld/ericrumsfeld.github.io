hemes-native.css?v=5847e5ed4a4568527aa6cfab446049ca" media="none" id="highlight_theme_dark"> <script>
    initTheme();
  </script> </head> <body class="fixed-top-nav "> <header> <nav id="navbar" class="navbar navbar-light navbar-expand-sm fixed-top" role="navigation"> <div class="container"> <a class="navbar-brand title font-weight-lighter" href="/"> <span class="font-weight-bold">Eric Rumsfeld</span> </a> <button class="navbar-toggler collapsed ml-auto" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"> <span class="sr-only">Toggle navigation</span> <span class="icon-bar top-bar"></span> <span class="icon-bar middle-bar"></span> <span class="icon-bar bottom-bar"></span> </button> <div class="collapse navbar-collapse text-right" id="navbarNav"> <ul class="navbar-nav ml-auto flex-nowrap"> <li class="nav-item "> <a class="nav-link" href="/">Home </a> </li> <li class="nav-item active"> <a class="nav-link" href="/projects/">Projects <span class="sr-only">(current)</span> </a> </li> <li class="nav-item "> <a class="nav-link" href="/blog/">Articles </a> </li> <li class="nav-item "> <a class="nav-link" href="/resume/">Resume </a> </li> <li class="nav-item "> <a class="nav-link" href="/about-me/">About Me </a> </li> <li class="nav-item"> <button id="search-toggle" title="Search" onclick="openSearchModal()"> <span class="nav-link">ctrl k <i class="fa-solid fa-magnifying-glass"></i></span> </button> </li> <li class="toggle-container"> <button id="light-toggle" title="Change theme"> <i class="fa-half-sun-moon" id="light-toggle-system"></i> <i class="fa-solid fa-moon" id="light-toggle-dark"></i> <i class="fa-solid fa-sun" id="light-toggle-light"></i> </button> </li> </ul> </div> </div> </nav> <progress id="progress" value="0"> <div class="progress-container"> <span class="progress-bar"></span> </div> </progress> </header> <div class="container mt-5" role="main"> <div class="post"> <header class="post-header"> <h1 class="post-title">NBA Draft Player Movement Tracker</h1> <p class="post-description">Interactive visualization of NBA Draft prospect rankings across seasons.</p> </header> <article> <script src="https://cdn.plot.ly/plotly-3.3.0.min.js"></script> <div style="display:flex; gap:20px; flex-wrap:wrap; margin-bottom:20px;"> <div> <label for="player">Player</label> <select id="player" style="width:230px;"></select> </div> <div> <label for="season">Season</label> <select id="season" style="width:150px;"></select> </div> </div> <div id="movement-plot" style="width:100%; min-height:550px;"></div> <script>
(async function () {
  const response = await fetch(
  "/assets/json/boards.json"
);

  if (!response.ok) {
    document.getElementById('movement-plot').textContent =
      'Could not load ranking data.';
    return;
  }

  const boards = await response.json();

  const playerSelect = document.getElementById('player');
  const seasonSelect = document.getElementById('season');

  const seasons = [...new Set(boards.map(d => d.season))].sort();

  seasons.forEach(season => {
    seasonSelect.add(new Option(season, season));
  });

  seasonSelect.value = seasons.includes('2024-2025')
    ? '2024-2025' : seasons[seasons.length - 1];

  function updatePlayers() {
    const players = [...new Set(
      boards.filter(d => d.season === seasonSelect.value)
            .map(d => d.fullName)
    )].sort();

    const previous = playerSelect.value;
    playerSelect.replaceChildren();

    players.forEach(player => {
      playerSelect.add(new Option(player, player));
    });

    playerSelect.value = players.includes(previous)
      ? previous
      : players.includes('Cedric Coward')
        ? 'Cedric Coward'
        : players[0];

    drawPlot();
  }

  function drawPlot() {
    const season = seasonSelect.value;
    const player = playerSelect.value;

    const seasonData = boards.filter(d => d.season === season);
    const playerData = seasonData
      .filter(d => d.fullName === player)
      .sort((a, b) => a.boardDate.localeCompare(b.boardDate));

    // Background: each other player's trajectory
    const otherPlayers = [...new Set(
      seasonData.map(d => d.fullName)
    )].filter(name => name !== player);

    const traces = otherPlayers.map(name => {
      const rows = seasonData
        .filter(d => d.fullName === name)
        .sort((a, b) => a.boardDate.localeCompare(b.boardDate));

      return {
        x: rows.map(d => d.boardDate),
        y: rows.map(d => d.rank),
        type: 'scatter',
        mode: 'lines+markers',
        line: {color: 'rgba(150,150,150,0.18)', width: 1},
        marker: {color: 'rgba(150,150,150,0.18)', size: 3},
        hoverinfo: 'skip',
        showlegend: false
      };
    });

    // Foreground: selected player
    traces.push({
      x: playerData.map(d => d.boardDate),
      y: playerData.map(d => d.rank),
      customdata: playerData.map(d => [d.source]),
      type: 'scatter',
      mode: 'lines+markers',
      name: player,
      line: {color: '#b91c1c', width: 2.5},
      marker: {color: '#b91c1c', size: 8},
      hovertemplate:
        '<b>' + player.replaceAll('&', '&amp;').replaceAll('<', '&lt;') + '</b><br>' +
        'Source: %{customdata[0]}<br>' +
        'Date: %{x}<br>' +
        'Rank: %{y}<extra></extra>'
    });



const seasonEvents = {
  '2023-2024': {
    seasonStart: '2023-11-06',
    marchStart: '2024-03-21',
    marchEnd: '2024-04-08',
    combineStart: '2024-05-12',
    combineEnd: '2024-05-19'
  },
  '2024-2025': {
    seasonStart: '2024-11-04',
    marchStart: '2025-03-20',
    marchEnd: '2025-04-07',
    combineStart: '2025-05-11',
    combineEnd: '2025-05-18'
  },
  '2025-2026': {
    seasonStart: '2025-11-03',
    marchStart: '2026-03-19',
    marchEnd: '2026-04-06',
    combineStart: '2026-05-10',
    combineEnd: '2026-05-17'
  }
};

const eventColors = {
  seasonStart: '#fb5607',
  marchMadness: '#006644',
  nbaCombine: '#8338ec'
};

const events = seasonEvents[season];


const eventLines = [];
const eventLabels = [];

function addEventLine(date, color) {
  eventLines.push({
    type: 'line',
    xref: 'x',
    yref: 'paper',
    x0: date,
    x1: date,
    y0: 0,
    y1: 1,
    line: {
      color: color,
      width: 1.7,
      dash: 'dash'
    }
  });
}

function addEventLabel(text, date, color, xanchor = 'center') {
  eventLabels.push({
    xref: 'x',
    yref: 'paper',
    x: date,
    y: 0.97,
    text: `<b>${text}</b>`,
    showarrow: false,
    xanchor: xanchor,
    yanchor: 'top',
    font: {
      size: 11,
      color: color
    },
    bgcolor: 'rgba(255,255,255,0.88)',
    borderpad: 4
  });
}

function midpoint(date1, date2) {
  const a = new Date(date1).getTime();
  const b = new Date(date2).getTime();

  return new Date((a + b) / 2).toISOString().slice(0, 10);
}

// Season Start
addEventLine(events.seasonStart, eventColors.seasonStart);

addEventLabel(
  'Season Start',
  events.seasonStart,
  eventColors.seasonStart,
  'left'
);

// March Madness
addEventLine(events.marchStart, eventColors.marchMadness);
addEventLine(events.marchEnd, eventColors.marchMadness);

addEventLabel(
  'March<br>Madness',
  midpoint(events.marchStart, events.marchEnd),
  eventColors.marchMadness
);

// NBA Combine
addEventLine(events.combineStart, eventColors.nbaCombine);
addEventLine(events.combineEnd, eventColors.nbaCombine);

addEventLabel(
  'NBA<br>Combine',
  midpoint(events.combineStart, events.combineEnd),
  eventColors.nbaCombine
);


const layout = {
  // Dynamic plot title
  title: {
    text: `${player} Rank Movement ${season.replace('-', '–').replace(/20(\d{2})$/, '$1')}`,
    x: 0.5,
    xanchor: 'center',
    font: {
      size: 20,
      color: '#333333'
    }
  },

  // X-axis
  xaxis: {
    title: {
      text: 'Article Date',
      font: { size: 15, color: '#333333' },
      standoff: 15
    },
    type: 'date',
    tickfont: { size: 12, color: '#333333' },
    automargin: true
  },

  // Y-axis
  yaxis: {
    title: {
      text: 'Big Board Rank',
      font: { size: 15, color: '#333333' },
      standoff: 15
    },
    range: [105, 0],
    tickfont: { size: 12, color: '#333333' },
    automargin: true
  },

  // Horizontal and Vertical reference lines
shapes: [
  ...[14, 30, 60].map(rank => ({
    type: 'line',
    xref: 'paper',
    x0: 0,
    x1: 1,
    yref: 'y',
    y0: rank,
    y1: rank,
    line: {
      color: '#38bdf8',
      dash: 'dash',
      width: 1.5
    }
  })),
  ...eventLines
],

  // Vertical upward arrows at right end of each line
  annotations: [
    { rank: 14, label: 'Lottery' },
    { rank: 30, label: '1st Round' },
    { rank: 60, label: '2nd Round' }
  ].map(item => ({
    xref: 'paper',
    x: 1.015,
    yref: 'y',
    y: item.rank,
    ax: 0,
    ay: 20,

    text: item.label,
    showarrow: true,

    // Tail sits below the arrowhead

    arrowhead: 2,
    arrowsize: 1,
    arrowwidth: 1.5,
    arrowcolor: '#38bdf8',

    font: {
      size: 11,
      color: '#555555'
    },

    xanchor: 'left',
    align: 'left',
    bgcolor: 'rgba(255,255,255,0.85)',
    borderpad: 2
  })),
  ...eventLabels
],

  // Give labels and arrows enough space
  margin: {
    l: 100,
    r: 125,
    t: 95,
    b: 100
  },

  hovermode: 'closest',
  showlegend: true,
  paper_bgcolor: '#ffffff',
  plot_bgcolor: '#ffffff'
};



    Plotly.react('movement-plot', traces, layout, {
  responsive: true,
  displaylogo: false,
  modeBarButtonsToRemove: ['select2d', 'lasso2d']
});
  }

  seasonSelect.addEventListener('change', updatePlayers);
  playerSelect.addEventListener('change', drawPlot);

  updatePlayers();
})();
</script> </article> </div> </div> <footer class="fixed-bottom" role="contentinfo"> <div class="container mt-0"> © Copyright 2026 Eric Rumsfeld . Powered by <a href="https://jekyllrb.com/" target="_blank" rel="external nofollow noopener">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio" rel="external nofollow noopener" target="_blank">al-folio</a> theme. Hosted by <a href="https://pages.github.com/" target="_blank" rel="external nofollow noopener">GitHub Pages</a>. </div> </footer> <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script> <script src="/assets/js/bootstrap.bundle.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/js/mdb.min.js" integrity="sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js" integrity="sha256-Nn1q/fx0H7SNLZMQ5Hw5JLaTRZp0yILA/FRexe19VdI=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/imagesloaded@5.0.0/imagesloaded.pkgd.min.js" integrity="sha256-htrLFfZJ6v5udOG+3kNLINIKh2gvoKqwEhHYfTTMICc=" crossorigin="anonymous"></script> <script defer src="/assets/js/masonry.js?v=a0db7e5d5c70cc3252b3138b0c91dcaf" type="text/javascript"></script> <script defer src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js" integrity="sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+jWc=" crossorigin="anonymous"></script> <script defer src="/assets/js/zoom.js?v=85ddb88934d28b74e78031fd54cf8308"></script> <script src="/assets/js/no_defer.js?v=2781658a0a2b13ed609542042a859126"></script> <script defer src="/assets/js/common.js?v=c15de51d4bb57887caa2c21988d97279"></script> <script defer src="/assets/js/copy_code.js?v=c8a01c11a92744d44b093fc3bda915df" type="text/javascript"></script> <script defer src="/assets/js/jupyter_new_tab
